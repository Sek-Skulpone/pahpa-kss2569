<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ร่วมทำบุญออนไลน์</title>
  <meta name="theme-color" content="#063d27">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=18">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" defer></script>
  <style>
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .chips button {
      font: 500 1rem "Kanit"; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line);
      background: #fff; color: var(--green-dark); cursor: pointer;
    }
    .chips button.on { background: var(--green); color: #fff; border-color: var(--green); }
    .amount-input { font-size: 1.6rem !important; font-family: "Kanit"; text-align: center; }
    .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; }
    .check input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--green); flex: none; }
  </style>
</head>
<body>
  <header class="topbar"><div class="container">
    <a href="index.html" class="back" aria-label="กลับ">‹</a>
    <div class="brand">ร่วมทำบุญออนไลน์<small data-s="eventPurpose"></small></div>
  </div></header>

  <main class="container">
    <div id="closed-msg" class="card" hidden><h2>ปิดรับบริจาคออนไลน์แล้ว</h2><p>ขออนุโมทนาบุญทุกท่าน</p></div>

    <div id="form">
      <div class="card">
        <h2><span class="step-num">1</span>จำนวนเงินที่ร่วมทำบุญ</h2>
        <input id="f-amount" class="amount-input" type="number" min="1" inputmode="decimal" placeholder="0">
        <div class="chips" id="chips"></div>
      </div>

      <div class="card">
        <h2><span class="step-num">2</span>ข้อมูลผู้ร่วมทำบุญ</h2>
        <div class="row-3">
          <div><label for="f-prefix">คำนำหน้า</label><select id="f-prefix"></select></div>
          <div><label for="f-first">ชื่อ <span class="opt">(ไม่บังคับ)</span></label><input id="f-first" type="text" autocomplete="given-name"></div>
          <div><label for="f-last">นามสกุล <span class="opt">(ไม่บังคับ)</span></label><input id="f-last" type="text" autocomplete="family-name"></div>
        </div>
        <div class="row">
          <div><label for="f-position">ตำแหน่ง <span class="opt">(ไม่บังคับ)</span></label><input id="f-position" type="text"></div>
          <div><label for="f-workplace">สถานที่ทำงาน <span class="opt">(ไม่บังคับ)</span></label><input id="f-workplace" type="text"></div>
        </div>
        <label for="f-phone">เบอร์โทรศัพท์ <span class="opt">(ไม่บังคับ)</span></label>
        <input id="f-phone" type="tel" inputmode="tel" autocomplete="tel">
        <label for="f-note">ข้อความ/คำอธิษฐาน <span class="opt">(ไม่บังคับ)</span></label>
        <input id="f-note" type="text">
        <label class="check"><input type="checkbox" id="f-show" checked> ยินดีให้แสดงรายนามในหน้า “รายนามผู้ร่วมทำบุญ”</label>
      </div>

      <div class="card">
        <h2><span class="step-num">3</span>ชำระเงิน</h2>
        <div id="pay"></div>
        <div id="summary" hidden></div>
        <h3>แนบสลิปการโอนเงิน <span class="opt" style="font-size:.85rem;color:var(--muted);font-weight:400">(ไม่บังคับ)</span></h3>
        <div class="upload">
          <input id="slip-input" type="file" accept="image/*">
          <div class="ph">📎 แตะเพื่อเลือกรูปสลิป</div>
          <div id="slip-preview" class="preview"></div>
        </div>
        <div id="slip-status" class="slip-status"></div>
      </div>

      <div class="card" id="sign-card">
        <h2><span class="step-num">4</span>ป้ายขอบคุณ</h2>
        <label class="check" style="margin-top:0"><input type="checkbox" id="f-publish" checked> ต้องการให้ทำป้ายขอบคุณ ลงเพจ <span data-s="schoolName">โรงเรียนโคกสีวิทยาสรรค์</span></label>
        <div id="photo-box">
        <p class="hint">แนบรูปของท่านเพื่อใส่ในป้ายขอบคุณ (ไม่บังคับ)</p>
        <div class="upload">
          <input id="photo-input" type="file" accept="image/*">
          <div class="ph">🖼️ แตะเพื่อเลือกรูปภาพ</div>
          <div id="photo-preview" class="preview"></div>
        </div>
        </div>
      </div>
      <div class="card contact-card">📞 สอบถามเพิ่มเติม: <span data-s="contactInfo"></span> <a data-tel="contactInfoPhone" hidden></a></div>
    </div>
  </main>

  <div class="bottom-bar"><div class="container">
    <div class="sum"><small>ยอดทำบุญ</small><strong id="total-bar">0</strong> บาท</div>
    <button id="submit" class="btn btn-primary">ส่งข้อมูลทำบุญ</button>
  </div></div>

  <script type="module">
    import { initOrderPage } from "./assets/js/order-form.js?v=18";
    import { $, $$, baht } from "./assets/js/common.js?v=18";

    const amt = () => Math.round((parseFloat($("#f-amount").value) || 0) * 100) / 100;

    initOrderPage({
      type: "donation",
      prefix: "DN",
      openKey: "openDonate",
      hasDelivery: false,
      photoInput: true,
      reviewCard: "#sign-card",
      optionalSlip: true,
      optionalName: true,
      successTitle: "ขออนุโมทนาบุญ",
      onReady(s, refresh) {
        const presets = [100, 200, 500, 1000, 2000, 5000];
        $("#chips").innerHTML = presets.map((v) => `<button type="button" data-v="${v}">${baht(v)}</button>`).join("");
        const sync = () => $$("#chips button").forEach((b) => b.classList.toggle("on", +b.dataset.v === amt()));
        $$("#chips button").forEach((b) => (b.onclick = () => { $("#f-amount").value = b.dataset.v; sync(); refresh(); }));
        $("#f-amount").oninput = () => { sync(); refresh(); };
        const pub = () => ($("#photo-box").hidden = !$("#f-publish").checked);
        $("#f-publish").addEventListener("change", pub);
        $("#form").addEventListener("change", pub);
        setTimeout(pub);
      },
      getState: () => ({ amount: $("#f-amount").value }),
      setState: (st) => { $("#f-amount").value = st.amount || ""; $("#f-amount").oninput(); },
      calc() {
        const a = amt();
        return { lines: a > 0 ? [["ร่วมทำบุญ", a]] : [], subtotal: a, error: a > 0 ? "" : "กรุณาระบุจำนวนเงินที่ร่วมทำบุญ" };
      },
      extra() {
        return {
          amount: amt(),
          position: $("#f-position").value.trim(),
          workplace: $("#f-workplace").value.trim(),
          showName: $("#f-show").checked && !!($("#f-first").value.trim() || $("#f-last").value.trim()),
          allowPublish: $("#f-publish").checked,
        };
      },
    });
  </script>
</body>
</html>
